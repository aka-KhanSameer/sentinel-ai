services:
  sentinel:
    build: .
    ports: ["8080:8080"]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      MAX_UPLOAD_BYTES: 5242880
      MAX_TEXT_BYTES: 1048576
      MAX_PROCESSING_MS: 20000
      TESSERACT_LANG_PATH: /app/models/tessdata
      SENTINEL_MODEL_DIR: /app/models/sentinel-deberta-v3-prompt-injection-v2
    volumes:
      - ./models:/app/models:ro
    read_only: true
    tmpfs: [/tmp:size=16m,noexec,nosuid]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
